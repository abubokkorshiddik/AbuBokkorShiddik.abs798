function helpOpen(){const it=(t,b)=>`<details><summary>${t}</summary><p>${b}</p></details>`;dlg('<h2 style="margin:0 0 6px">How to use DaySpace</h2><p class="m s">Tap a title to open it.</p>'+[
it('Getting started','Open the menu (☰ at the top left) to move between sections. Start with Routine and Habits, then use Today as your daily home screen.'),
it('Routine (pen and paper)','Write your day like a notebook page. Type a line such as "6:30 Wake up" or "6-7pm Gym" and press ↵. Tick a line when it is done. Tap Routine styles for ready-made days, or switch to Clean for a simple list.'),
it('Timed routines (Start / End)','Press ▶ on any routine (Sleep, Study…). Choose Now, or the exact time you really started. Optionally let it end automatically after a number of minutes. When you wake or finish, press ⏹ and choose Now or the exact time, so a forgotten timer can still be ended correctly. The time is counted automatically as that routine\'s number for the day and the routine is marked done. A session is counted on the day it ends, so a night of sleep counts on the day you wake up. Fix or add sessions any time in Routine, Time log. The Activity log keeps things short: each section shows its bar plus the current and latest entry, and a Show all button opens the rest. The Activity log also has a Routine timer bar that shows, for the day you pick, from when to when you used each timed routine, and you can move to any previous or next day. The Routine page has the same two bars (Activity bar and Routine timer bar) with day arrows, plus a Compare panel: choose a routine (or all), then compare Today with yesterday, pick any dates, or use the last 7, 14, 30 or all days. Each day shows a 24-hour strip of when you used it and the total time, with the difference from today and the average. A session that crosses midnight is drawn on the day it ends, from 12 AM. Set a planned length and auto-end by editing a routine (⋯). Sessions are only auto-ended when the app is open, and are closed at the planned time next time you open it.'),
it('Activity log (one-off, per day)','This is separate from your daily routines. Open Activity log, type what you are doing (for example Study), choose Now or an exact start time, and press Start. When you finish, press Finish: the app works out the end time, the total duration and the from-to range. If you forgot, press the clock button next to Finish and enter the time you really finished. You can also set Auto-finish after some minutes, add a past activity, or edit any entry. Pick any day to see its entries, a 24-hour strip and totals per activity (day, 7 days or 30 days). An activity is counted on the day it ends, so a night of sleep counts on the day you wake. Activities you log at least 3 times appear in Insights as minutes per day for correlation, and you can export them as CSV. If you start an activity and forget to finish it, tap ⋯ on the running activity (or the warning that appears after many hours) and choose Finished at a chosen time, Mark as unfinished (kept as a record, but not counted in totals), or Restart (marks the old one unfinished and starts a fresh timer now). Unfinished entries show in that day with a red tag; tap one to set a finish time or restart it.'),
it('Finance (income, costs and budgets)','Press the 💰 Finance button at the top, next to Activity. Pick a day, choose Expense or Income, type the amount, choose a category and press Add. Income adds to your balance and costs subtract from it. Your balance is all income minus all costs, shown for the day, the month and all time. Categories are your own list, for example Daily Savings, Food, Education or Snacks. Open 🗂 Categories (or tap ✨ Ideas for a starter list) to edit them. For each cost you can mark it Good, Bad or Regular and set a daily target: at most (a limit, good for bad costs such as snacks) or at least (a target, good for savings or education). Choose how often the amount applies: every day, every week or every month. A weekly amount is spread over 7 days and a monthly amount over 30 days (or the real days of the month, your choice under 💱 Budget), so for example a monthly market of 6,000 gives about 200 a day. Cost plans & targets then shows, for each plan, today\'s allowance (what is left in the plan divided by the days left, so the daily number adjusts as you spend), the even daily share, and how much is left this week or month. The top of the box adds up your spending room for the day. Leave the daily budget empty to use the total of your plans as your daily budget. Daily plans also show how many days in a row you kept them. The top of the page shows income, spent, net, balance, what you saved and your total savings. The app stays on the Finance page when you reload it (turn this off under 💱 Budget). 💱 Currency & budget sets your currency symbol, a daily budget and a monthly budget. The month section shows income, spending, balance, savings, a daily spending chart, where the money went and your income sources. Daily spending also appears in Insights, so you can see how it relates to your mood and routines. Export everything as CSV. Amounts use the one currency you choose; changing the symbol does not convert old amounts.'),
it('Editing, archive, history and restore','Nothing is lost by accident. When you edit a routine or habit, choose "From today onward": the past days keep the old version (old time, repeat days or target), so your progress and Insights are not rewritten. Choose "Everywhere" only to fix a mistake. Open ⋯ → 🕘 History to see every version with the dates it was followed, how many days you completed, and to restore an older version from today. Instead of deleting, use Archive: it stops the routine or habit from today (or tomorrow if you already completed it today) but all past days stay in Progress, the calendar and Insights. Press 📦 Archive on the Routine or Habits page to see archived items with the dates you followed them, and Restore them any time. Delete forever is still there, but it asks first and cannot be undone.'),
it('Sub-routines (steps) and performance','Your daily routines stay as they are. Tap ↳＋ on any routine to add steps inside it, for example Study → Review notes, Practice problems, Summarise. Tick each step daily. Each step can repeat every day or run only on chosen dates: when adding, pick Every day or Only today, and open the ⋯ on a step to choose several specific dates. A step set for one date does not appear tomorrow. That day\'s steps are also listed in the Activity log for that day. When all of that day\'s steps are done the routine is marked done automatically. The Routine page shows a Routine performance ranking: each routine\'s score is the share of its steps you completed on scheduled days, with full-day counts, streaks and your weakest step, so you can see which routine performs best and where to improve. Steps also appear in Insights for correlation analysis and in the CSV export.'),
it('Habits','Add good habits to build and bad habits to reduce. Track them as done or not done, a count, or hours. Tap a day in the monthly grid to log it. A habit does not have to continue forever: open ⋯ and choose Mark as built. It stops asking for input after that date and moves to Built habits, which shows the days you worked. Deleting a habit removes all of its history.'),
it('Progress','Pick 7, 15, 30 or 60 days. Short ranges use bars, long ranges use a trend line. Tap any bar or point to see its value, and tap a habit to see its own chart.'),
it('Insights (correlations)','Insights compares all your numbers day by day: timed routines (minutes), numeric habits, done/not-done items and journal mood. It lists the strongest relationships, shows a colour map, and lets you tap any pair to see a scatter plot. "Same day" compares two things on one day. "Next day" asks whether more of A today goes with more or less of B tomorrow. Correlation (r) runs from -1 to +1: near +1 means they rise together, near -1 means one goes up when the other goes down, near 0 means no link. It does not prove cause. Use at least 14 days, ideally 30 or more. You can export all daily numbers as CSV.'),
it('Journal','Write one note or many notes per day (change this in Settings). Use the toolbar for bold, colours and highlights, and add photos to any note.'),
it('Tasks and Goals','Add to-dos for today, tomorrow or this week. If you do not pick a date, the task is set for today. You can also add an optional expected time (from and to) and a reminder (at the start time, or 5 minutes to 1 hour before). Tasks with a time appear in a Task reminders box on Today, above or below the routine countdown (change this in Settings). Alerts are shown on screen, and as a phone or browser notification if you allow it, but only while the app is open. Goals have a progress slider you can update any time.'),
it('Routine countdown','On Today, the countdown card shows your previous routine (done or not done, with a Mark done button), the current routine with the time left, and the next routine with the time until it starts. Between routines it shows free time and when the next one begins.'),
it('Photos and sharing','Photos are private by default. Tap the link icon to create a public link, and tap it again to stop sharing. Sharing needs you to be signed in.'),
it('Going back','Every window has a Back button and a ✕. You can also tap outside it or use your phone\'s back button.'),
it('Your data','Signed in: your data is saved online. Guest: it stays on this device, so export a backup from Settings, Developer options.')].join('')+'<div class="ft"><button class="btn p" data-act="close">Got it</button></div>')}

function csvFin(){const L=['date,type,category,amount,spread_days,note'];FT().sort((a,b)=>a.data.day.localeCompare(b.data.day)||a.created_at.localeCompare(b.created_at)).forEach(x=>L.push([x.data.day,x.data.kind=='in'?'income':x.data.kind=='wd'?'withdrawal':'expense',q(fname(x)),x.data.amt,nsp(x),q(x.data.note||'')].join(',')));dl('dayspace-finance-'+TODAY()+'.csv',L.join('\n'))}
async function finDel(id){S.items=S.items.filter(x=>x.id!=id);persist();if(sb)await send({k:'del',id})}

else if(a=='f-edit')finEdit(D.id);
else if(a=='f-save'){const x=byId(D.id),amt=+$('#ea').value,day=$('#ed').value;if(!(amt>0))return toast('Enter an amount');if(!day)return toast('Pick a date');const cid=$('#ec').value;x.data.amt=amt;x.data.day=day;x.data.note=$('#en').value.trim();{const es=$('#es');if(es){const n=Math.max(1,Math.min(3650,Math.floor(+es.value)||1));if(n>1)x.data.spread=n;else delete x.data.spread}}if(cid){const c=fcat(cid);x.data.cat=cid;x.data.catn=c.title;x.title=c.title}await save(x);S.fd=day;close();render();toast('Saved')}
else if(a=='f-del'){if(!confirm('Delete this entry?'))return;await finDel(D.id);close();render()}
else if(a=='f-cat')catList();else if(a=='f-catnew')catEdit(null,D.k,D.s=='1');else if(a=='f-catedit')catEdit(D.id);
else if(a=='f-catsave'){const name=$('#fcn').value.trim();if(!name)return toast('Give the category a name');const c=D.id?byId(D.id):mk('entry',{data:{sec:'__fcat'}}),x=c.data;c.title=name;x.emoji=$('#fce').value.trim();x.kind=$('#fck').value;
if(x.kind=='out'){x.type=$('#fct').value;x.dir=$('#fcd').value;const g=$('#fcg').value,m=$('#fcm').value;x.per=$('#fcp').value;x.target=g===''?null:+g;x.mbud=(x.per=='month'||m==='')?null:+m;x.saving=$('#fcs').checked;if(x.saving){x.dir='min';x.type=x.type=='bad'?'regular':x.type;const o=$('#fco').value,gl=$('#fcgl').value;x.open=o===''?null:+o;x.sgoal=gl===''?null:+gl}else{x.open=null;x.sgoal=null}}else{x.type='regular';x.target=null;x.mbud=null;x.saving=false;x.open=null;x.sgoal=null;delete x.dir}
await save(c);S.fcat[x.kind]=c.id;if(S.view=='finance'&&S.fk!=x.kind&&!D.id)S.fk=x.kind;close();render();toast('Category saved')}

else if(a=='f-budsave'){const c=$('#bc').value,cur=c=='__c'?($('#bcc').value.trim()||'৳'):c;S.set.fin={cur,daily:+$('#bd2').value||0,monthly:+$('#bm').value||0,mdiv:$('#bdv').value,wstart:+$('#bws').value,stay:$('#bst').value=='1'};apply();close();render();toast('Saved')}

else if(a=='f-svsave'){const amt=+$('#sa').value,c=fcat($('#sc').value),day=$('#sd').value||S.fd,wd=D.v=='wd';if(!c)return toast('Choose a savings category');if(!(amt>0))return toast('Enter an amount');if(wd){const bal=fopen(c)+fbal(fidx(),c);if(amt>bal+1e-9)return toast('Only '+$m(bal)+' saved in '+c.title)}
const sp=wd?'1':$('#svsp').value,n=sp=='M'?fdays(day.slice(0,7)):+sp,data={sec:'__fin',kind:wd?'wd':'out',cat:c.id,catn:c.title,amt,day,note:$('#sn').value.trim()};if(n>1)data.spread=n;await save(mk('entry',{title:c.title,data}));S.fd=day;close();render();toast((wd?'Withdrawn −':'Saved +')+$m(amt).replace('−','')+' · '+c.title)}
else if(a=='f-csv')csvFin()});
