<style>
:root{--a:#2458d3;--bg:#f5f7fb;--c:#fff;--t:#172238;--m:#68758a;--l:#e5e9f1;--g:#16835f;--r:#c23d4b;--fs:15px}
[data-theme=dark]{--bg:#0e1522;--c:#172033;--t:#e8edf7;--m:#93a0b6;--l:#263250}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:var(--fs)/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}.hidden{display:none!important}.m{color:var(--m)}.s{font-size:12px}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--l);border-radius:11px;background:var(--c);outline:none}input:focus,textarea:focus,select:focus{border-color:var(--a)}
label.f{display:block;margin:12px 0 0;font-size:12px;font-weight:700;color:var(--m)}label.f>*{margin-top:5px;font-weight:400;color:var(--t)}
.btn{border:1px solid var(--l);background:var(--c);border-radius:11px;padding:9px 14px;font-weight:700}.btn.p{background:var(--a);border-color:var(--a);color:#fff}.btn.d{color:var(--r)}
.ib{border:0;background:none;color:var(--m);padding:4px 8px;border-radius:8px}.ib:hover{background:var(--l)}
.side{position:fixed;inset:0 auto 0 0;width:226px;background:var(--c);border-right:1px solid var(--l);padding:20px 12px;display:flex;flex-direction:column}
.brand{font-weight:850;font-size:20px;padding:0 10px 22px;display:flex;gap:9px;align-items:center}.mark{width:30px;height:30px;border-radius:9px;background:var(--a);color:#fff;display:grid;place-items:center}
#nav{display:flex;flex-direction:column;gap:2px}.nb{display:flex;gap:12px;align-items:center;border:0;background:none;padding:10px 12px;border-radius:11px;color:var(--m);font-weight:650;text-align:left}.nb.on{background:color-mix(in srgb,var(--a) 13%,transparent);color:var(--a)}.nb i{font-style:normal;width:20px;text-align:center}
.main{margin-left:226px;padding:28px clamp(16px,4vw,48px) 60px;max-width:1100px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}h1{margin:0;font-size:clamp(24px,5vw,32px);letter-spacing:-.8px}.top p{margin:2px 0 0}
.panel{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:16px;margin-bottom:14px}.panel h2{font-size:15px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid .panel{margin:0}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--l)}.row:last-child{border:0}.row span{flex:1;min-width:0;overflow-wrap:anywhere}.row.dn span{text-decoration:line-through;color:var(--m)}
.ck{appearance:none;width:22px;height:22px;border:2px solid var(--l);border-radius:7px;flex-shrink:0;margin:0;padding:0}.ck:checked{background:var(--a);border-color:var(--a)}.ck:checked:after{content:'✓';color:#fff;display:block;text-align:center;line-height:18px;font-size:14px}
.ring{display:flex;gap:16px;align-items:center}.ring svg{width:84px;height:84px;transform:rotate(-90deg)}.ring b{font-size:26px}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--l);color:var(--m)}.pill.a{background:color-mix(in srgb,var(--a) 15%,transparent);color:var(--a)}.pill.r{background:#c23d4b22;color:var(--r)}.pill.g{background:#16835f22;color:var(--g)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.pb{height:8px;background:var(--l);border-radius:8px;overflow:hidden}.pb i{display:block;height:100%;background:var(--a);border-radius:8px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.trk{border-collapse:separate;border-spacing:3px;font-size:11px}.trk th{color:var(--m);font-weight:600;min-width:26px}.trk td.n{position:sticky;left:0;background:var(--c);min-width:112px;max-width:112px;font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:1}
.cell{width:26px;height:26px;border-radius:8px;border:1px solid var(--l);background:none;padding:0}.cell.on{background:var(--hc,var(--a));border-color:var(--hc,var(--a))}.cell.off{opacity:.25}.cell.td{outline:2px solid var(--a);outline-offset:1px}
.bars{display:flex;gap:8px;align-items:flex-end;height:110px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--m);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bars i{display:block;background:var(--a);border-radius:6px 6px 0 0;min-height:3px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.heat div{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:11px;background:var(--l)}
.mood{display:flex;gap:6px}.mood button{flex:1;font-size:24px;padding:8px 0;border:1px solid var(--l);background:none;border-radius:12px;opacity:.55}.mood button.on{opacity:1;border-color:var(--a);background:color-mix(in srgb,var(--a) 12%,transparent)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.ph{background:var(--c);border:1px solid var(--l);border-radius:14px;overflow:hidden}.ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--l)}.ph div{padding:8px 10px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid var(--l);background:var(--c);border-radius:20px;padding:6px 13px;font-weight:650;font-size:13px}.chip.on{background:var(--a);color:#fff;border-color:var(--a)}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--c);box-shadow:0 0 0 1px var(--l);padding:0}.sw.on{box-shadow:0 0 0 3px var(--t)}
.empty{text-align:center;padding:28px 10px;color:var(--m)}
dialog{border:0;border-radius:20px;padding:20px;width:min(520px,calc(100% - 24px));max-height:92vh;background:var(--c);color:var(--t);box-shadow:0 24px 80px #0006}dialog::backdrop{background:#0a1426a0}
.ft{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.pre{max-height:200px;overflow:auto;background:#101d33;color:#d8e6ff;padding:12px;border-radius:10px;font:11px/1.5 monospace;white-space:pre}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:90%}#toast.show{opacity:1}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}#auth form{width:min(380px,100%)}
.fab{display:none}
@media(max-width:760px){.side{inset:auto 0 0 0;width:100%;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--l);z-index:20}.side .brand,.side .sb{display:none}#nav{flex-direction:row;overflow-x:auto;width:100%}.nb{flex-direction:column;gap:0;font-size:10px;padding:6px 10px;min-width:62px;align-items:center}.nb i{font-size:18px}
.main{margin:0;padding:calc(18px + env(safe-area-inset-top)) 14px 100px}.grid{grid-template-columns:1fr}#add{display:none}.fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:0;background:var(--a);color:#fff;font-size:28px;box-shadow:0 8px 24px #0004;z-index:21}}
</style></head><body>
<div id="auth" class="hidden"><form id="af"><div class="brand"><span class="mark">D</span>DaySpace</div><h1 id="at">Welcome back</h1><p class="m">Your routines, habits, journal and photos in one calm place.</p>
<label class="f" id="an">Your name<input id="aname" autocomplete="name"></label><label class="f">Email<input id="aem" type="email" required autocomplete="email"></label><label class="f">Password<input id="apw" type="password" minlength="6" required autocomplete="current-password"></label>
<div class="ft" style="flex-direction:column"><button class="btn p" id="asub">Sign in</button><button type="button" class="btn" id="asw">Create an account</button></div></form></div>
<div id="app" class="hidden"><aside class="side"><div class="brand"><span class="mark">D</span>DaySpace</div><nav id="nav"></nav><div class="sb" style="margin-top:auto"><button class="nb" data-act="settings"><i>⚙</i>Settings</button></div></aside>
<main class="main"><div class="top"><div><h1 id="ttl"></h1><p class="m" id="sub"></p></div><div style="display:flex;gap:6px"><button class="btn ib" data-act="settings" style="font-size:18px">⚙</button><button class="btn p" id="add" data-act="add">＋ Add</button></div></div><div id="view"></div></main><button class="fab" data-act="add" aria-label="Add">＋</button></div>
<dialog id="dlg"></dialog><input type="file" id="file" accept="image/*" multiple class="hidden"><div id="toast"></div>
<script type="text/plain" id="sql">
-- Run once in Supabase > SQL Editor (safe to re-run; keeps your existing data)
create table if not exists public.items(id uuid primary key default gen_random_uuid(),owner_id uuid not null references auth.users(id) on delete cascade,type text not null,title text not null default '',content text not null default '',completed boolean not null default false,due_date date,visibility text not null default 'private',share_token text unique,data jsonb not null default '{}',created_at timestamptz not null default now(),updated_at timestamptz not null default now());
alter table public.items add column if not exists data jsonb not null default '{}';
alter table public.items drop constraint if exists items_type_check;
alter table public.items drop constraint if exists items_title_check;
alter table public.items add constraint items_type_check check (type in ('task','routine','habit','note','goal','photo'));
create table if not exists public.logs(owner_id uuid not null references auth.users(id) on delete cascade,item_id uuid not null references public.items(id) on delete cascade,day date not null,primary key(item_id,day));
alter table public.items enable row level security;alter table public.logs enable row level security;
drop policy if exists own_items on public.items;create policy own_items on public.items for all to authenticated using(owner_id=auth.uid()) with check(owner_id=auth.uid());
drop policy if exists own_logs on public.logs;create policy own_logs on public.logs for all to authenticated using(owner_id=auth.uid()) with check(owner_id=auth.uid());
create or replace function public.get_shared(t text) returns jsonb language sql security definer set search_path=public as $$ select to_jsonb(i)-'owner_id'-'share_token' from items i where share_token=t and visibility='link' $$;
grant execute on function public.get_shared(text) to anon,authenticated;
insert into storage.buckets(id,name,public) values('photos','photos',false),('public-photos','public-photos',true) on conflict do nothing;
drop policy if exists own_photos on storage.objects;
create policy own_photos on storage.objects for all to authenticated using(bucket_id in('photos','public-photos') and (storage.foldername(name))[1]=auth.uid()::text) with check(bucket_id in('photos','public-photos') and (storage.foldername(name))[1]=auth.uid()::text);
</script>
<script>
/* ===== CONFIG: paste your Supabase project URL + anon key to enable accounts, sync and sharing. Leave blank for local-only mode. ===== */
const CFG={url:'',key:''};
const sb=CFG.url&&window.supabase?supabase.createClient(CFG.url,CFG.key):null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dts=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),pd=s=>new Date(s+'T12:00'),TODAY=()=>dts(new Date());
const VIEWS=[['today','◉','Today'],['routines','↻','Routine'],['habits','✳','Habits'],['journal','✎','Journal'],['progress','▲','Progress'],['tasks','✓','Tasks'],['goals','◎','Goals'],['photos','▣','Photos']];
const ACC=['#2458d3','#7c3aed','#db2777','#e11d48','#ea580c','#16835f','#0891b2','#475569'],MOODS=['😞','😕','😐','🙂','😄'],FREQ=['Daily','Weekdays','Weekends'];
const S={items:[],logs:{},urls:{},user:null,view:'today',month:new Date(),jday:TODAY(),tf:'open',set:Object.assign({acc:ACC[0],theme:'auto',fs:15,off:[],name:''},JSON.parse(localStorage.ds_set||'{}'))};
const of=t=>S.items.filter(i=>i.type==t),done=(id,d)=>!!S.logs[id+'|'+d],byId=id=>S.items.find(i=>i.id==id);
const appl=(i,d)=>{const f=i.data.freq||'Daily',w=pd(d).getDay();return i.created_at.slice(0,10)<=d&&(f=='Daily'||(f=='Weekdays'&&w>0&&w<6)||(f=='Weekends'&&(w==0||w==6)))};
const dayStat=d=>{const a=[...of('routine'),...of('habit')].filter(i=>appl(i,d));return[a.filter(i=>done(i.id,d)).length,a.length]};
const pct=d=>{const[x,n]=dayStat(d);return n?Math.round(x/n*100):null};
const streak=h=>{let d=new Date(),n=0,first=true;for(let k=0;k<400;k++,d.setDate(d.getDate()-1)){const s=dts(d);if(!appl(h,s))continue;if(done(h.id,s))n++;else if(first&&s==TODAY()){}else break;first=false}return n};
const mk=(type,o={})=>({id:crypto.randomUUID(),type,title:'',content:'',completed:false,due_date:null,visibility:'private',share_token:null,data:{},created_at:new Date().toISOString(),...o});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
const persist=()=>{if(!sb)localStorage.ds_data=JSON.stringify({items:S.items,logs:S.logs})};
async function save(it){const i=S.items.findIndex(x=>x.id==it.id);i<0?S.items.push(it):S.items[i]=it;persist();if(sb){const{error}=await sb.from('items').upsert({...it,owner_id:S.user.id});if(error)toast(error.message)}return it}
async function toggle(id,d){const k=id+'|'+d,on=!S.logs[k];on?S.logs[k]=1:delete S.logs[k];persist();render();if(sb){const{error}=await(on?sb.from('logs').insert({owner_id:S.user.id,item_id:id,day:d}):sb.from('logs').delete().eq('item_id',id).eq('day',d));if(error)toast(error.message)}}
async function remove(id){const it=byId(id);if(!it||!confirm('Delete "'+(it.title||'this item')+'"?'))return;S.items=S.items.filter(i=>i.id!=id);persist();render();if(sb){if(it.type=='photo'){sb.storage.from('photos').remove([it.data.path]);sb.storage.from('public-photos').remove([it.data.path])}await sb.from('items').delete().eq('id',id)}}
async function load(){if(sb){const[a,b]=await Promise.all([sb.from('items').select('*').order('created_at'),sb.from('logs').select('item_id,day')]);S.items=a.data||[];S.logs={};(b.data||[]).forEach(l=>S.logs[l.item_id+'|'+l.day]=1);if(a.error)toast('Run the setup SQL in Settings → '+a.error.message);await sign()}else{const d=JSON.parse(localStorage.ds_data||'{"items":[],"logs":{}}');S.items=d.items;S.logs=d.logs}}
async function sign(){if(!sb)return;const p=of('photo').map(x=>x.data.path).filter(Boolean);if(!p.length)return;const{data}=await sb.storage.from('photos').createSignedUrls(p,3600);(data||[]).forEach(x=>S.urls[x.path]=x.signedUrl)}
const imgUrl=p=>!sb?p.data.url:p.data.pub?sb.storage.from('public-photos').getPublicUrl(p.data.pub).data.publicUrl:S.urls[p.data.path]||'';
/* settings */
function apply(){const s=S.set,r=document.documentElement;r.style.setProperty('--a',s.acc);r.style.setProperty('--fs',s.fs+'px');r.dataset.theme=s.theme=='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):s.theme;localStorage.ds_set=JSON.stringify(s);if(sb&&S.user)sb.auth.updateUser({data:{prefs:s}})}
/* views */
const ring=p=>`<svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" fill="none" stroke="var(--l)" stroke-width="9"/><circle cx="40" cy="40" r="34" fill="none" stroke="var(--a)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${213.6*p/100} 214"/></svg>`;
const row=(i,d)=>`<div class="row ${done(i.id,d)?'dn':''}"><input type="checkbox" class="ck" ${done(i.id,d)?'checked':''} data-act="log" data-id="${i.id}" data-day="${d}"><span>${esc(i.data.emoji||'')} ${esc(i.title)}</span><small class="m">${esc(i.data.time||'')}</small><button class="ib" data-act="edit" data-id="${i.id}">⋯</button></div>`;
const trow=t=>`<div class="row ${t.completed?'dn':''}"><input type="checkbox" class="ck" ${t.completed?'checked':''} data-act="tdone" data-id="${t.id}"><span>${esc(t.title)}</span>${t.data.pri=='High'?'<span class="pill r" style="flex:none">High</span>':''}${t.due_date?`<small class="${t.due_date<TODAY()&&!t.completed?'pill r':'m'}">${t.due_date.slice(5)}</small>`:''}<button class="ib" data-act="edit" data-id="${t.id}">⋯</button></div>`;
const none=(t,b)=>`<div class="empty">${t}${b?`<br><button class="btn p" style="margin-top:10px" data-act="add" data-t="${b}">＋ Add ${b}</button>`:''}</div>`;
const jent=d=>S.items.find(i=>i.type=='note'&&i.data.day==d);
const V={
today(){const d=TODAY(),[x,n]=dayStat(d),p=n?Math.round(x/n*100):0,R=of('routine').filter(i=>appl(i,d)).sort((a,b)=>(a.data.time||'99').localeCompare(b.data.time||'99')),H=of('habit').filter(i=>appl(i,d)),T=of('task').filter(t=>!t.completed&&t.due_date&&t.due_date<=d),e=jent(d);
return`<div class="panel ring">${ring(p)}<div><b>${p}%</b><div class="m">${x} of ${n} routines & habits done today</div></div></div>
<div class="grid"><div class="panel"><h2>Today's routine</h2>${R.map(i=>row(i,d)).join('')||none('No routine yet.','routine')}</div><div class="panel"><h2>Habits</h2>${H.map(i=>row(i,d)).join('')||none('No habits yet.','habit')}</div></div>
<div class="grid" style="margin-top:14px"><div class="panel"><h2>Due & overdue</h2>${T.map(trow).join('')||'<div class="empty">Nothing due. 🎉</div>'}</div><div class="panel"><h2>Quick journal</h2><textarea id="jq" rows="4" placeholder="How is today going?">${esc(e?.content||'')}</textarea></div></div>`},
routines(){const R=of('routine').sort((a,b)=>(a.data.time||'99').localeCompare(b.data.time||'99')),d=TODAY(),B=[['Morning',0,12],['Afternoon',12,17],['Evening',17,25]],hr=i=>i.data.time?+i.data.time.slice(0,2):-1;
return R.length?B.map(([n,a,b])=>{const L=R.filter(i=>(hr(i)<0?(n=='Morning'):hr(i)>=a&&hr(i)<b)&&true);return L.length?`<div class="panel"><h2>${n}</h2>${L.map(i=>row(i,d)+'').join('')}</div>`:''}).join(''):`<div class="panel">${none('Build your day: add routines with a time, repeat days and an emoji.','routine')}</div>`},
habits(){const m=S.month,y=m.getFullYear(),mo=m.getMonth(),n=new Date(y,mo+1,0).getDate(),H=of('habit'),t=TODAY();let h=`<div class="panel"><div class="bar"><button class="btn" data-act="mon" data-d="-1">‹</button><b>${m.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button class="btn" data-act="mon" data-d="1">›</button></div>`;
if(!H.length)return h+none('Track habits day by day across the month.','habit')+'</div>';
h+=`<div class="scroll"><table class="trk"><tr><th></th>${[...Array(n)].map((_,i)=>`<th>${i+1}</th>`).join('')}<th>%</th></tr>`;
H.forEach(i=>{let a=0,c=0;const cells=[...Array(n)].map((_,k)=>{const d=dts(new Date(y,mo,k+1)),ap=appl(i,d),on=done(i.id,d);if(ap&&d<=t){a++;if(on)c++}return`<td><button class="cell ${on?'on':''} ${ap?'':'off'} ${d==t?'td':''}" style="--hc:${i.data.color||'var(--a)'}" data-act="log" data-id="${i.id}" data-day="${d}"></button></td>`}).join('');
h+=`<tr><td class="n" data-act="edit" data-id="${i.id}">${esc(i.data.emoji||'')} ${esc(i.title)}</td>${cells}<td><b>${a?Math.round(c/a*100):0}</b></td></tr>`});
return h+'</table></div></div>'},
journal(){const d=S.jday,e=jent(d),L=of('note').sort((a,b)=>b.data.day.localeCompare(a.data.day)).slice(0,30);
return`<div class="panel"><div class="bar"><button class="btn" data-act="jd" data-d="-1">‹</button><input type="date" id="jdate" value="${d}" style="width:auto"><button class="btn" data-act="jd" data-d="1">›</button></div>
<div class="mood">${MOODS.map((m,i)=>`<button class="${e?.data.mood==i+1?'on':''}" data-act="mood" data-v="${i+1}">${m}</button>`).join('')}</div>
<label class="f">Today's journal<textarea id="jt" rows="9" placeholder="Wins, gratitude, thoughts, lessons…">${esc(e?.content||'')}</textarea></label>
<div class="ft">${e?`<button class="btn" data-act="share" data-id="${e.id}">${e.visibility=='link'?'🌐 Shared':'🔒 Private'}</button>`:''}</div></div>
<div class="panel"><h2>Past entries</h2>${L.map(n=>`<div class="row"><span data-act="jgo" data-day="${n.data.day}" style="cursor:pointer"><b>${n.data.day}</b> ${MOODS[n.data.mood-1]||''}<br><small class="m">${esc(n.content.slice(0,90))}</small></span><button class="ib" data-act="remove" data-id="${n.id}">🗑</button></div>`).join('')||'<div class="empty">Your entries will appear here.</div>'}</div>`},
progress(){const t=TODAY(),days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return dts(d)}),m=S.month,y=m.getFullYear(),mo=m.getMonth(),n=new Date(y,mo+1,0).getDate(),H=of('habit'),T=of('task'),G=of('goal'),
avg=Math.round(days.map(pct).filter(x=>x!=null).reduce((a,b,_,r)=>a+b/r.length,0)),best=Math.max(0,...H.map(streak));
return`<div class="grid" style="grid-template-columns:repeat(4,1fr)">${[['Today',(pct(t)??0)+'%'],['7-day avg',avg+'%'],['Best streak',best+'d'],['Tasks done',T.filter(x=>x.completed).length+'/'+T.length]].map(([a,b])=>`<div class="panel"><div class="m s">${a}</div><b style="font-size:24px">${b}</b></div>`).join('')}</div>
<div class="panel" style="margin-top:14px"><h2>Last 7 days</h2><div class="bars">${days.map(d=>`<div><i style="height:${pct(d)??0}%"></i>${pd(d).toLocaleDateString(undefined,{weekday:'narrow'})}</div>`).join('')}</div></div>
<div class="panel"><div class="bar"><h2 style="margin:0">${m.toLocaleDateString(undefined,{month:'long'})} consistency</h2><span><button class="btn" data-act="mon" data-d="-1">‹</button> <button class="btn" data-act="mon" data-d="1">›</button></span></div><div class="heat">${[...Array(new Date(y,mo,1).getDay())].map(()=>'<span></span>').join('')}${[...Array(n)].map((_,k)=>{const d=dts(new Date(y,mo,k+1)),p=pct(d);return`<div style="${p!=null?`background:color-mix(in srgb,var(--a) ${Math.max(p,8)}%,var(--l))`:''}">${k+1}</div>`}).join('')}</div></div>
<div class="grid"><div class="panel"><h2>Habit streaks</h2>${H.map(h=>`<div class="row"><span>${esc(h.data.emoji||'')} ${esc(h.title)}</span><b>🔥 ${streak(h)}</b></div>`).join('')||'<div class="empty">No habits yet.</div>'}</div><div class="panel"><h2>Goals</h2>${G.map(g=>`<div style="margin-bottom:12px"><div class="bar" style="margin:0 0 4px"><span>${esc(g.title)}</span><b>${g.data.progress||0}%</b></div><div class="pb"><i style="width:${g.data.progress||0}%"></i></div></div>`).join('')||'<div class="empty">No goals yet.</div>'}</div></div>`},
tasks(){const L=of('task').filter(t=>S.tf=='all'||(S.tf=='done')==t.completed).sort((a,b)=>(a.due_date||'9').localeCompare(b.due_date||'9'));
return`<div class="chips">${['open','done','all'].map(f=>`<button class="chip ${S.tf==f?'on':''}" data-act="tf" data-f="${f}">${f}</button>`).join('')}</div><div class="panel">${L.map(trow).join('')||none('No tasks here.','task')}</div>`},
goals(){const L=of('goal');return L.map(g=>`<div class="panel"><div class="bar"><b>${esc(g.title)}</b><span><span class="pill a">${g.data.progress||0}%</span> <button class="ib" data-act="share" data-id="${g.id}">${g.visibility=='link'?'🌐':'🔒'}</button><button class="ib" data-act="edit" data-id="${g.id}">⋯</button></span></div><div class="pb"><i style="width:${g.data.progress||0}%"></i></div>${g.content?`<p class="m s">${esc(g.content)}</p>`:''}${g.due_date?`<span class="pill">Target ${g.due_date}</span>`:''}</div>`).join('')||`<div class="panel">${none('Set a goal and move it forward with a progress slider.','goal')}</div>`},
photos(){const L=of('photo').sort((a,b)=>b.created_at.localeCompare(a.created_at));return L.length?`<div class="photos">${L.map(p=>`<div class="ph"><img loading="lazy" src="${imgUrl(p)}" alt=""><div><span class="pill ${p.visibility=='link'?'g':''}">${p.visibility=='link'?'Public':'Private'}</span><span style="flex:1"></span><button class="ib" data-act="share" data-id="${p.id}">🔗</button><button class="ib" data-act="remove" data-id="${p.id}">🗑</button></div></div>`).join('')}</div>`:`<div class="panel">${none('Upload photos. They stay private until you share a link.')}<div style="text-align:center"><button class="btn p" data-act="add">＋ Upload photos</button></div></div>`}};
const SUB={today:'Small steps, every day.',routines:'Your day, in order.',habits:'Tap a day to check it off.',journal:'Capture today in a few lines.',progress:'See how far you have come.',tasks:'Get things done.',goals:'Keep moving forward.',photos:'Private by default.'};
function render(){const v=S.view,vs=VIEWS.filter(x=>!S.set.off.includes(x[0])||x[0]==v);$('#nav').innerHTML=vs.map(x=>`<button class="nb ${x[0]==v?'on':''}" data-act="nav" data-v="${x[0]}"><i>${x[1]}</i>${x[2]}</button>`).join('');
const nm=S.set.name||S.user?.user_metadata?.name||'';$('#ttl').textContent=v=='today'?(new Date().getHours()<12?'Good morning':new Date().getHours()<18?'Good afternoon':'Good evening')+(nm?', '+nm:''):VIEWS.find(x=>x[0]==v)[2];$('#sub').textContent=v=='today'?new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}):SUB[v];
$('#add').style.display=['progress','journal'].includes(v)?'none':'';document.querySelector('.fab').style.visibility=['progress','journal'].includes(v)?'hidden':'';$('#view').innerHTML=V[v]()}
/* dialogs */
const dlg=h=>{const d=$('#dlg');d.innerHTML=h;d.showModal()},close=()=>$('#dlg').close();
const field=(l,h)=>`<label class="f">${l}${h}</label>`;
function form(type,id){const it=id?byId(id):mk(type),t=it.type,D=it.data,o=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
return`<form id="ef" data-id="${it.id}" data-t="${t}"><h2 style="margin:0">${id?'Edit':'New'} ${t}</h2>${field('Title',`<input name="title" required maxlength="160" value="${esc(it.title)}" autofocus>`)}
${t=='routine'||t=='habit'?field('Emoji',`<input name="emoji" maxlength="4" value="${esc(D.emoji||'')}" placeholder="🏃">`)+field('Repeats',`<select name="freq">${o(FREQ,D.freq||'Daily')}</select>`):''}
${t=='routine'?field('Time',`<input type="time" name="time" value="${D.time||''}">`):''}
${t=='habit'?field('Colour',`<input type="color" name="color" value="${D.color&&D.color[0]=='#'?D.color:S.set.acc}" style="height:44px;padding:4px">`):''}
${t=='task'?field('Due date',`<input type="date" name="due" value="${it.due_date||''}">`)+field('Priority',`<select name="pri">${o(['Normal','High'],D.pri||'Normal')}</select>`):''}
${t=='goal'?field('Target date',`<input type="date" name="due" value="${it.due_date||''}">`)+field('Progress: <b id="pv">'+(D.progress||0)+'%</b>',`<input type="range" name="progress" min="0" max="100" step="5" value="${D.progress||0}" oninput="pv.textContent=this.value+'%'">`):''}
${t=='task'||t=='goal'?field('Notes',`<textarea name="content" rows="3">${esc(it.content)}</textarea>`):''}
<div class="ft">${id?'<button type="button" class="btn d" data-act="remove" data-id="'+id+'" style="margin-right:auto">Delete</button>':''}<button type="button" class="btn" data-act="close">Cancel</button><button class="btn p">Save</button></div></form>`}
function settings(){const s=S.set;dlg(`<h2 style="margin:0">Settings</h2>${field('Display name',`<input id="sn" value="${esc(s.name)}">`)}<div class="f">Accent colour</div><div class="chips">${ACC.map(c=>`<button class="sw ${c==s.acc?'on':''}" style="background:${c}" data-act="acc" data-c="${c}"></button>`).join('')}</div>
${field('Theme',`<select id="st">${['auto','light','dark'].map(x=>`<option ${x==s.theme?'selected':''}>${x}</option>`).join('')}</select>`)}${field('Text size',`<select id="sf">${[14,15,17].map(x=>`<option value="${x}" ${x==s.fs?'selected':''}>${{14:'Small',15:'Medium',17:'Large'}[x]}</option>`).join('')}</select>`)}
<div class="f">Sections to show</div><div class="chips">${VIEWS.filter(x=>x[0]!='today').map(x=>`<button class="chip ${s.off.includes(x[0])?'':'on'}" data-act="mod" data-v="${x[0]}">${x[2]}</button>`).join('')}</div>
<div class="ft" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn" data-act="export">Export data</button><button class="btn" data-act="sql">Setup SQL</button>${sb?'<button class="btn d" data-act="out">Sign out</button>':''}</div><p class="m s">${sb?'Signed in as '+esc(S.user.email):'Local mode: data stays on this device. Add your Supabase keys in CONFIG for accounts, sync and sharing.'}</p><div class="ft"><button class="btn p" data-act="close">Done</button></div>`)}
async function share(id){const it=byId(id);if(!sb)return toast('Sharing needs Supabase (see Settings)');const on=it.visibility=='link';
if(it.type=='photo'){if(!on){const{data}=await sb.storage.from('photos').download(it.data.path);const r=await sb.storage.from('public-photos').upload(it.data.path,data,{upsert:true,contentType:'image/jpeg'});if(r.error)return toast(r.error.message);it.data.pub=it.data.path}else{sb.storage.from('public-photos').remove([it.data.path]);delete it.data.pub}}
if(!on){it.visibility='link';it.share_token=it.share_token||crypto.randomUUID().replace(/-/g,'')}else it.visibility='private';await save(it);render();
if(it.visibility=='link'){const u=location.origin+location.pathname+'#/s/'+it.share_token;dlg(`<h2 style="margin:0">Public link</h2><p class="m">Anyone with this link can view this ${it.type}.</p><div class="pre" style="white-space:normal">${u}</div><div class="ft"><button class="btn d" data-act="share" data-id="${id}">Stop sharing</button><button class="btn p" data-act="copy" data-u="${u}">Copy link</button></div>`)}else{close();toast('Now private')}}
/* photos */
const shrink=f=>new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.82)};im.src=URL.createObjectURL(f)});
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
$('#file').onchange=async e=>{toast('Uploading…');for(const f of e.target.files){const b=await shrink(f),p=mk('photo',{title:'Photo',data:{day:TODAY()}});if(sb){p.data.path=S.user.id+'/'+p.id+'.jpg';const{error}=await sb.storage.from('photos').upload(p.data.path,b,{contentType:'image/jpeg'});if(error){toast(error.message);continue}}else p.data.url=await b64(b);await save(p)}e.target.value='';await sign();render();toast('Photos added')};
/* events */
let jt;const jsave=async patch=>{let e=jent(S.jday)||mk('note',{title:'Journal '+S.jday,data:{day:S.jday}});e.content=patch.content??e.content;if(patch.mood)e.data.mood=patch.mood;await save(e);return e};
document.addEventListener('input',e=>{if(e.target.id=='jt'||e.target.id=='jq'){clearTimeout(jt);const v=e.target.value,d=e.target.id=='jt'?S.jday:TODAY();jt=setTimeout(()=>{const o=S.jday;S.jday=d;jsave({content:v});S.jday=o},600)}});
document.addEventListener('change',e=>{if(e.target.id=='jdate'){S.jday=e.target.value||TODAY();render()}if(e.target.id=='sn'){S.set.name=e.target.value;apply();render()}if(e.target.id=='st'){S.set.theme=e.target.value;apply()}if(e.target.id=='sf'){S.set.fs=+e.target.value;apply()}});
document.addEventListener('submit',async e=>{if(e.target.id!='ef')return;e.preventDefault();const f=e.target,g=n=>f.elements[n]?.value,id=f.dataset.id,t=f.dataset.t,it=byId(id)||mk(t);it.title=g('title').trim();if(f.elements.content)it.content=g('content');if(f.elements.due)it.due_date=g('due')||null;
['emoji','freq','time','color','pri'].forEach(k=>{if(f.elements[k])it.data[k]=g(k)});if(f.elements.progress)it.data.progress=+g('progress');await save(it);close();render()});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,D=b.dataset;
if(a=='nav'){S.view=D.v;render();scrollTo(0,0)}else if(a=='log')toggle(id,D.day);else if(a=='tdone'){const t=byId(id);t.completed=!t.completed;await save(t);render()}
else if(a=='add'){const v=S.view;if(v=='photos')return $('#file').click();const T={routines:'routine',habits:'habit',tasks:'task',goals:'goal'}[v];if(D.t||T)dlg(form(D.t||T));else dlg(`<h2 style="margin:0 0 10px">Add</h2><div class="chips">${['task','routine','habit','goal'].map(x=>`<button class="chip" data-act="add2" data-t="${x}">${x}</button>`).join('')}</div>`)}
else if(a=='add2')dlg(form(D.t));else if(a=='edit')dlg(form(null,id));else if(a=='close')close();else if(a=='remove'){close();remove(id)}
else if(a=='mon'){S.month=new Date(S.month.getFullYear(),S.month.getMonth()+ +D.d,1);render()}else if(a=='tf'){S.tf=D.f;render()}
else if(a=='jd'){const d=pd(S.jday);d.setDate(d.getDate()+ +D.d);S.jday=dts(d);render()}else if(a=='jgo'){S.jday=D.day;render();scrollTo(0,0)}else if(a=='mood'){await jsave({mood:+D.v});render()}
else if(a=='share')share(id);else if(a=='copy'){navigator.clipboard?.writeText(D.u);toast('Link copied')}
else if(a=='settings')settings();else if(a=='acc'){S.set.acc=D.c;apply();settings()}else if(a=='mod'){const o=S.set.off,i=o.indexOf(D.v);i<0?o.push(D.v):o.splice(i,1);apply();settings();render()}
else if(a=='sql')dlg(`<h2 style="margin:0 0 8px">Setup SQL</h2><div class="pre">${esc($('#sql').textContent.trim())}</div><div class="ft"><button class="btn" data-act="close">Close</button><button class="btn p" data-act="copy" data-u="${esc($('#sql').textContent.trim()).replace(/\n/g,'&#10;')}">Copy SQL</button></div>`)
else if(a=='export'){const u=URL.createObjectURL(new Blob([JSON.stringify({items:S.items,logs:S.logs,settings:S.set},null,1)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='dayspace-'+TODAY()+'.json';l.click()}
else if(a=='out'){await sb.auth.signOut();location.reload()}});
/* boot */
function start(){$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');apply();load().then(render)}
async function shared(tok){$('#app').classList.add('hidden');const{data}=await sb.rpc('get_shared',{t:tok}),b=document.body;if(!data)return b.innerHTML='<div class="empty" style="padding:80px 20px"><h2>Link unavailable</h2>This item is private or no longer shared.</div>';
const p=data.type=='photo'?`<img style="width:100%;border-radius:14px" src="${sb.storage.from('public-photos').getPublicUrl(data.data.pub).data.publicUrl}">`:`<p style="white-space:pre-wrap">${esc(data.content)}</p>`;b.innerHTML=`<main class="main" style="margin:auto;max-width:640px"><div class="brand"><span class="mark">D</span>DaySpace</div><h1>${esc(data.title)}</h1><div class="panel">${p}${data.type=='goal'?`<div class="pb"><i style="width:${data.data.progress||0}%"></i></div>`:''}</div></main>`}
(async()=>{apply();const h=location.hash;if(sb&&h.startsWith('#/s/'))return shared(h.slice(4));
if(!sb){S.user={id:'local',email:'local'};return start()}
const{data}=await sb.auth.getSession();if(data.session){S.user=data.session.user;Object.assign(S.set,S.user.user_metadata?.prefs||{});return start()}
$('#auth').classList.remove('hidden');let up=false;$('#an').classList.add('hidden');
$('#asw').onclick=()=>{up=!up;$('#an').classList.toggle('hidden',!up);$('#at').textContent=up?'Create your space':'Welcome back';$('#asub').textContent=up?'Create account':'Sign in';$('#asw').textContent=up?'I have an account':'Create an account'};
$('#af').onsubmit=async e=>{e.preventDefault();const em=$('#aem').value,pw=$('#apw').value;const r=up?await sb.auth.signUp({email:em,password:pw,options:{data:{name:$('#aname').value}}}):await sb.auth.signInWithPassword({email:em,password:pw});
if(r.error)return toast(r.error.message);if(!r.data.session)return toast('Check your email to confirm your account');S.user=r.data.session.user;start()}})();
</script></body></html>
