create table if not exists public.items(id uuid primary key default gen_random_uuid(),owner_id uuid not null references auth.users(id) on delete cascade,type text not null,title text not null default '',content text not null default '',completed boolean not null default false,due_date date,visibility text not null default 'private',share_token text unique,data jsonb not null default '{}',created_at timestamptz not null default now(),updated_at timestamptz not null default now());
alter table public.items add column if not exists data jsonb not null default '{}';
alter table public.items drop constraint if exists items_type_check;
alter table public.items drop constraint if exists items_title_check;
alter table public.items add constraint items_type_check check (type in ('task','routine','habit','note','goal','photo','entry'));
create table if not exists public.logs(owner_id uuid not null references auth.users(id) on delete cascade,item_id uuid not null references public.items(id) on delete cascade,day date not null,primary key(item_id,day));
alter table public.logs add column if not exists val numeric;
alter table public.items enable row level security;alter table public.logs enable row level security;
drop policy if exists own_items on public.items;create policy own_items on public.items for all to authenticated using(owner_id=auth.uid()) with check(owner_id=auth.uid());
drop policy if exists own_logs on public.logs;create policy own_logs on public.logs for all to authenticated using(owner_id=auth.uid()) with check(owner_id=auth.uid());
create or replace function public.get_shared(t text) returns jsonb language sql security definer set search_path=public as $$ select to_jsonb(i)-'owner_id'-'share_token' from items i where share_token=t and visibility='link' $$;
grant execute on function public.get_shared(text) to anon,authenticated;
insert into storage.buckets(id,name,public) values('photos','photos',false),('public-photos','public-photos',true) on conflict do nothing;
drop policy if exists own_photos on storage.objects;
create policy own_photos on storage.objects for all to authenticated using(bucket_id in('photos','public-photos') and (storage.foldername(name))[1]=auth.uid()::text) with check(bucket_id in('photos','public-photos') and (storage.foldername(name))[1]=auth.uid()::text);

<div class="chips">${[['today','Today'],['two','2 days'],['week','This week'],['all','All']].map(([k,l])=>`<button class="chip ${S.tr==k?'on':''}" data-act="tr" data-f="${k}">${l}</button>`).join('')}<span class="m s" style="align-self:center">${dn}/${L.length} done</span></div><div class="panel">${L.map(trow).join('')||none('Nothing planned for this range.')}</div>`};
const cview=id=>{const c=S.set.custom.find(x=>x.id==id),L=of('entry').filter(x=>x.data.sec==id).sort((a,b)=>a.completed-b.completed||b.created_at.localeCompare(a.created_at));
return`<div class="panel"><div style="display:flex;gap:8px"><input id="qc" placeholder="Add to ${esc(c.name)}…"><button class="btn p" data-act="qc" data-sec="${id}">Add</button></div></div><div class="panel">${L.map(x=>`<div class="row ${x.completed?'dn':''}"><input type="checkbox" class="ck" ${x.completed?'checked':''} data-act="tdone" data-id="${x.id}"><span>${esc(x.title)}</span><button class="ib" data-act="remove" data-id="${x.id}">🗑</button></div>`).join('')||'<div class="empty">Nothing here yet. Add your first entry.</div>'}</div>`};
function render(){let v=S.view;const off=S.set.off,cs=S.set.custom;if(v.startsWith('c:')&&!cs.find(c=>'c:'+c.id==v))v=S.view='today';const vs=[...VIEWS.filter(x=>!off.includes(x[0])||x[0]==v),...cs.filter(c=>!off.includes('c:'+c.id)||'c:'+c.id==v).map(c=>['c:'+c.id,c.emoji,c.name])];
$('#nav').innerHTML=vs.map(x=>`<button class="nb ${x[0]==v?'on':''}" data-act="nav" data-v="${x[0]}"><i>${x[1]}</i>${esc(x[2])}</button>`).join('');
const nm=S.set.name||S.user?.user_metadata?.name||'',h=new Date().getHours(),cv=v.startsWith('c:')?cs.find(c=>'c:'+c.id==v):null;
$('#ttl').innerHTML=v=='today'?avh(40)+esc((h<12?'Good morning':h<18?'Good afternoon':'Good evening')+(nm?', '+nm:'')):esc(cv?cv.name:VIEWS.find(x=>x[0]==v)[2]);
$('#sub').textContent=v=='today'?new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}):cv?'Your own section.':SUB[v];
const hide=false;$('#add').style.display=hide?'none':'';document.querySelector('.fab').style.visibility=hide?'hidden':'';$('#view').innerHTML=cv?cview(cv.id):V[v]();if(v=='habits'){const t=document.querySelector('.cell.td');if(t)t.closest('.scroll').scrollLeft=Math.max(0,t.offsetLeft-140)}tick()}
function form(type,id){const it=id?byId(id):mk(type),t=it.type,D=it.data,o=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join(''),so=(a,v)=>a.map(([k,l])=>`<option value="${k}" ${k==v?'selected':''}>${l}</option>`).join('');
return`<form id="ef" data-id="${it.id}" data-t="${t}"><h2 style="margin:0">${id?'Edit':'New'} ${t}</h2>${field('Title',`<input name="title" required maxlength="160" value="${esc(it.title)}" autofocus>`)}
${t=='routine'||t=='habit'?field('Emoji',`<input name="emoji" maxlength="4" value="${esc(D.emoji||'')}" placeholder="🏃">`)+field('Repeats',`<select name="freq">${o(FREQ,D.freq||'Daily')}</select>`):''}
${t=='routine'?field('Starts',`<input type="time" name="time" value="${D.time||''}">`)+field('Ends',`<input type="time" name="end" value="${D.end||''}">`):''}
${t=='habit'?field('Habit type',`<select name="kind">${so([['build','🟢 Good habit: build it'],['quit','🔴 Bad habit: reduce or quit']],D.kind||'build')}</select>`)+field('Track as',`<select name="mode">${so([['check','Done / not done'],['count','A number (times, cups…)'],['hours','Hours']],D.mode||'check')}</select>`)+field('Unit (cups, hrs, cigs…)',`<input name="unit" value="${esc(D.unit||'')}">`)+field('Daily target',`<input type="number" step="any" min="0" name="target" value="${D.target??''}">`)+field('Goal is to stay',`<select name="dir">${so([['min','At least the target'],['max','At most the target (a limit)']],D.dir||'min')}</select>`)+field('Colour',`<input type="color" name="color" value="${D.color&&D.color[0]=='#'?D.color:D.kind=='quit'?'#c23d4b':S.set.acc}" style="height:44px;padding:4px">`):''}
${t=='task'?field('Due date',`<input type="date" name="due" value="${it.due_date||''}">`)+field('Priority',`<select name="pri">${o(['Normal','High'],D.pri||'Normal')}</select>`):''}
${t=='goal'?field('Target date',`<input type="date" name="due" value="${it.due_date||''}">`)+field('Progress: <b id="pv">'+(D.progress||0)+'%</b>',`<input type="range" name="progress" min="0" max="100" step="5" value="${D.progress||0}" oninput="pv.textContent=this.value+'%'">`):''}
${t=='task'||t=='goal'?field('Notes',`<textarea name="content" rows="3">${esc(it.content)}</textarea>`):''}
<div class="ft">${id?'<button type="button" class="btn d" data-act="remove" data-id="'+id+'" style="margin-right:auto">Delete</button>':''}<button type="button" class="btn" data-act="close">Cancel</button><button class="btn p">Save</button></div></form>`}
function settings(){const s=S.set;S.dlgFn=settings;dlg(`<h2 style="margin:0">Settings</h2><div style="text-align:center;margin:12px 0">${avh(76)}<br><button class="btn" data-act="avpick" style="margin-top:8px">${S.av?'Change photo':'Add profile photo'}</button> ${S.av?'<button class="btn d" data-act="avdel" style="margin-top:8px">Remove</button>':''}</div>${field('Display name',`<input id="sn" value="${esc(s.name)}">`)}${field('About you (optional)',`<textarea id="sbio" rows="2" maxlength="200">${esc(s.bio||'')}</textarea>`)}<div class="f">Accent colour</div><div class="chips">${ACC.map(c=>`<button class="sw ${c==s.acc?'on':''}" style="background:${c}" data-act="acc" data-c="${c}"></button>`).join('')}</div>
${field('Theme',`<select id="st">${['auto','light','dark'].map(x=>`<option ${x==s.theme?'selected':''}>${x}</option>`).join('')}</select>`)}${field('Text size',`<select id="sf">${[14,15,17].map(x=>`<option value="${x}" ${x==s.fs?'selected':''}>${{14:'Small',15:'Medium',17:'Large'}[x]}</option>`).join('')}</select>`)}
<div class="f">Sections (tap to show or hide)</div><div class="chips">${[...VIEWS.filter(x=>x[0]!='today').map(x=>[x[0],x[2]]),...s.custom.map(c=>['c:'+c.id,c.emoji+' '+c.name])].map(([k,l])=>`<button class="chip ${s.off.includes(k)?'':'on'}" data-act="mod" data-v="${k}">${esc(l)}</button>`).join('')}</div>
<div class="f">Add your own section</div><div style="display:flex;gap:8px"><input id="semo" placeholder="📌" style="width:62px" maxlength="4"><input id="snm" placeholder="e.g. Books to read" maxlength="30"><button class="btn p" data-act="addsec">Add</button></div>${s.custom.map(c=>`<div class="row"><span>${esc(c.emoji)} ${esc(c.name)}</span><button class="ib" data-act="delsec" data-id="${c.id}">🗑</button></div>`).join('')}
<div class="ft" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn" data-act="export">Export data</button><button class="btn" data-act="sql">Setup SQL</button>${sb?'<button class="btn d" data-act="out">Sign out</button>':''}</div><p class="m s">${sb?'Signed in as '+esc(S.user.email):'Local mode: data stays on this device.'}</p><div class="ft"><button class="btn p" data-act="close">Done</button></div>`)}
function onboard(){S.dlgFn=onboard;dlg(`<h2 style="margin:0">Welcome to DaySpace 👋</h2><p class="m">Make it yours. Everything here is optional.</p><div style="text-align:center;margin:12px">${avh(84)}<br><button class="btn" data-act="avpick" style="margin-top:8px">Add profile photo</button></div>${field('Your name',`<input id="on" value="${esc(S.set.name||S.user?.user_metadata?.name||'')}">`)}${field('About you',`<textarea id="ob" rows="2" maxlength="200" placeholder="What do you want to improve?">${esc(S.set.bio||'')}</textarea>`)}<div class="ft"><button class="btn" data-act="obskip">Skip</button><button class="btn p" data-act="obsave">Continue</button></div>`)}
/* extra events */
document.addEventListener('submit',async e=>{if(e.target.id!='ef')return;e.stopImmediatePropagation();e.preventDefault();const f=e.target,g=n=>f.elements[n]?.value,it=byId(f.dataset.id)||mk(f.dataset.t);it.title=g('title').trim();if(f.elements.content)it.content=g('content');if(f.elements.due)it.due_date=g('due')||null;
['emoji','freq','time','end','color','pri','kind','mode','unit','dir'].forEach(k=>{if(f.elements[k])it.data[k]=g(k)});if(f.elements.target)it.data.target=g('target')===''?null:+g('target');if(f.elements.progress)it.data.progress=+g('progress');await save(it);close();render()},true);
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
if(a=='log'&&isNum(byId(b.dataset.id))){e.stopImmediatePropagation();valDlg(b.dataset.id,b.dataset.day)}
if(a=='add'&&!b.dataset.t){const v=S.view;if(v.startsWith('c:')){e.stopImmediatePropagation();const c=S.set.custom.find(x=>'c:'+x.id==v);dlg(`<h2 style="margin:0">Add to ${esc(c.name)}</h2>${field('What do you want to add?',`<input id="qd" maxlength="160" autofocus>`)}<div class="ft"><button class="btn" data-act="close">Cancel</button><button class="btn p" data-act="qd" data-sec="${c.id}">Add</button></div>`)}else if(v=='journal'){e.stopImmediatePropagation();$('#jt')?.focus()}}},true);
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,D=b.dataset;
if(a=='sug')sugOpen();else if(a=='sugadd')sugAdd();else if(a=='val')valDlg(D.id,D.day);
else if(a=='vsave')setVal(D.id,D.day,$('#vi').value);else if(a=='vclr')setVal(D.id,D.day,null);
else if(a=='vstep'){const i=$('#vi');i.value=Math.max(0,Math.round(((+i.value||0)+ +D.s*i.dataset.st)*100)/100)}
else if(a=='tr'){S.tr=D.f;render()}
else if(a=='qadd'){const v=$('#qt').value.trim();if(!v)return;const w=+$('#qw').value;let due=null;if(w>=0){const x=new Date();x.setDate(x.getDate()+w);due=dts(x)}await save(mk('task',{title:v,due_date:due,data:{pri:'Normal'}}));render();$('#qt')?.focus()}
else if(a=='qd'){const v=$('#qd').value.trim();if(!v)return;await save(mk('entry',{title:v,data:{sec:D.sec}}));close();render()}
else if(a=='qc'){const v=$('#qc').value.trim();if(!v)return;await save(mk('entry',{title:v,data:{sec:D.sec}}));render();$('#qc')?.focus()}
else if(a=='avpick')$('#avf').click();else if(a=='avdel'){S.set.avatar='';S.av='';if(sb)sb.storage.from('photos').remove([S.user.id+'/avatar.jpg']);apply();render();settings()}
else if(a=='obsave'){S.set.name=$('#on').value.trim();S.set.bio=$('#ob').value.trim();S.set.onboarded=true;apply();close();render();if(!S.items.length)sugOpen()}
else if(a=='obskip'){S.set.onboarded=true;apply();close();if(!S.items.length)sugOpen()}
else if(a=='addsec'){const n=$('#snm').value.trim();if(!n)return toast('Give your section a name');S.set.custom.push({id:Date.now().toString(36),name:n,emoji:$('#semo').value.trim()||'📌'});apply();settings();render()}
else if(a=='delsec'){const c=S.set.custom.find(x=>x.id==D.id);if(!confirm('Delete section "'+c.name+'" and its entries?'))return;for(const it of of('entry').filter(x=>x.data.sec==D.id)){S.items=S.items.filter(x=>x.id!=it.id);if(sb)await sb.from('items').delete().eq('id',it.id)}S.set.custom=S.set.custom.filter(x=>x.id!=D.id);persist();apply();settings();render()}});
document.addEventListener('change',async e=>{if(e.target.id=='sbio'){S.set.bio=e.target.value;apply()}
if(e.target.id=='avf'&&e.target.files[0]){const b=await sq(e.target.files[0]);if(sb){const p=S.user.id+'/avatar.jpg',{error}=await sb.storage.from('photos').upload(p,b,{upsert:true,contentType:'image/jpeg'});if(error)return toast(error.message);S.set.avatar=p}else S.set.avatar=await b64(b);e.target.value='';apply();await avUrl();render();(S.dlgFn||settings)()}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&(e.target.id=='qt'||e.target.id=='qc'))document.querySelector('[data-act='+(e.target.id=='qt'?'qadd':'qc')+']').click()});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='qd')document.querySelector('[data-act=qd]').click()});
function start(){$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');apply();load().then(async()=>{await avUrl();render();if(!S.set.onboarded)onboard()})}
/* boot */
async function shared(tok){$('#app').classList.add('hidden');const{data}=await sb.rpc('get_shared',{t:tok}),b=document.body;if(!data)return b.innerHTML='<div class="empty" style="padding:80px 20px"><h2>Link unavailable</h2>This item is private or no longer shared.</div>';

(async()=>{apply();const h=location.hash;if(sb&&h.startsWith('#/s/'))return shared(h.slice(4));
if(!sb){S.user={id:'local',email:'local'};return start()}
const{data}=await sb.auth.getSession();if(data.session){S.user=data.session.user;Object.assign(S.set,S.user.user_metadata?.prefs||{});return start()}
$('#auth').classList.remove('hidden');let up=false;$('#an').classList.add('hidden');
$('#asw').onclick=()=>{up=!up;$('#an').classList.toggle('hidden',!up);$('#at').textContent=up?'Create your space':'Welcome back';$('#asub').textContent=up?'Create account':'Sign in';$('#asw').textContent=up?'I have an account':'Create an account'};

if(r.error)return toast(r.error.message);if(!r.data.session)return toast('Check your email to confirm your account');S.user=r.data.session.user;start()}})();
