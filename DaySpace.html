async function shared(tok){$('#app').classList.add('hidden');const{data}=await sb.rpc('get_shared',{t:tok}),b=document.body;if(!data)return b.innerHTML='<div class="empty" style="padding:80px 20px"><h2>Link unavailable</h2>This item is private or no longer shared.</div>';
const p=data.type=='photo'?`<img style="width:100%;border-radius:14px" src="${sb.storage.from('public-photos').getPublicUrl(data.data.pub).data.publicUrl}">`:`<div>${toHtml(data.content)}</div>`;b.innerHTML=`<main class="main" style="margin:auto;max-width:640px"><div class="brand"><span class="mark">D</span>DaySpace</div><h1>${esc(data.title)}</h1><div class="panel">${p}${data.type=='goal'?`<div class="pb"><i style="width:${data.data.progress||0}%"></i></div>`:''}</div></main>`}
(async()=>{apply();const h=location.hash;if(sb&&h.startsWith('#/s/'))return shared(h.slice(4));
if(!sbc){sb=null;S.user={id:'local',email:'guest'};return start()}
const{data}=await sbc.auth.getSession();if(data.session){S.user=data.session.user;Object.assign(S.set,S.user.user_metadata?.prefs||{});return start()}
const guest=()=>{sb=null;S.user={id:'local',email:'guest'};localStorage.ds_guest=1;start()};if(localStorage.ds_guest)return guest();
$('#auth').classList.remove('hidden');$('#agu').onclick=guest;let up=false;$('#an').classList.add('hidden');
$('#asw').onclick=()=>{up=!up;$('#an').classList.toggle('hidden',!up);$('#at').textContent=up?'Create your space':'Welcome back';$('#asub').textContent=up?'Create account':'Sign in';$('#asw').textContent=up?'I have an account':'Create an account'};
$('#af').onsubmit=async e=>{e.preventDefault();const em=$('#aem').value,pw=$('#apw').value;const r=up?await sbc.auth.signUp({email:em,password:pw,options:{data:{name:$('#aname').value}}}):await sbc.auth.signInWithPassword({email:em,password:pw});
if(r.error)return toast(r.error.message);if(!r.data.session)return toast('Check your email to confirm your account');S.user=r.data.session.user;start()}})();
